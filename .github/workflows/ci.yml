name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, macos-26-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-websockets-dev qt6-declarative-dev qt6-tools-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake_args=(-B build -G "Unix Makefiles"
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=ON
            -DQMDMM_EXPORT_PRIVATE=NO)
          if [ -n "${CMAKE_PREFIX_PATH:-}" ]; then
            cmake_args+=(-DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH")
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  docs:
    name: Publish API docs
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doxygen
        run: brew install doxygen

      - name: Install Qt
        run: |
          brew install qt
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build docs
        run: cmake --build build --target QMdmm_docs

      - name: Publish to qmdmm-docs
        env:
          DOCS_TOKEN: ${{ secrets.QMDMM_DOCS_TOKEN }}
        run: |
          cd build/doc/html
          touch .nojekyll
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish doxygen-generated API reference"
          git remote add origin "https://x-access-token:${DOCS_TOKEN}@github.com/nemn9852/qmdmm-docs.git"
          git push -f origin main
